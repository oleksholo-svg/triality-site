<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="logo.png">
<title>Triality — GTA 5 RP</title>
<meta name="description" content="Семья TRIALITY на GTA 5 RP Blaine. Набор открыт.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#07040c; --ink:#f3ecff; --ink2:#bfb0d6; --muted:#8a7aa3;
  --vio:#b44dff; --vio2:#d58bff; --line:rgba(190,120,255,.35);
  --card:linear-gradient(120deg,rgba(40,16,62,.9),rgba(14,7,24,.95));
  --f-logo:"Michroma","Unbounded",system-ui,sans-serif;
  --f-head:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--vio2);outline-offset:3px}
section{scroll-margin-top:80px}

#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main,header,footer{position:relative;z-index:1}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(7,4,12,.6);border-bottom:1px solid rgba(180,77,255,.12)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.nav{display:flex;align-items:center;gap:28px;padding-block:14px}
.logo{font-family:var(--f-logo);letter-spacing:.18em;font-size:17px}
.nav nav{display:flex;gap:26px;padding-left:28px;border-left:1px solid rgba(255,255,255,.15);font-size:13px}
.nav nav a{position:relative;color:var(--ink2);transition:color .3s}
.nav nav a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--vio2);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease);box-shadow:0 0 8px var(--vio)}
.nav nav a:hover{color:var(--ink)}
.nav nav a:hover::after{transform:scaleX(1)}
.nav .btns{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{display:inline-block;border-radius:99px;padding:8px 20px;font-size:13px;border:1px solid rgba(255,255,255,.35);transition:box-shadow .35s,border-color .35s,transform .35s var(--ease),background .35s}
.pill:hover{border-color:var(--vio2);box-shadow:0 0 18px rgba(180,77,255,.55);transform:translateY(-1px)}
.pill.solid{background:linear-gradient(180deg,#9b3be6,#6a1fb0);border-color:#c27aff;box-shadow:0 0 14px rgba(180,77,255,.45)}
.burger{display:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.3);place-items:center}
.burger svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none}
.mnav{display:none}

.hero{position:relative;padding-top:34px;text-align:center}
.frame{position:relative;padding:28px 0 0}
.br{position:absolute;width:16px;height:16px;border-color:rgba(255,255,255,.7);border-style:solid;border-width:0}
.br.tl{left:0;top:0;border-top-width:1.5px;border-left-width:1.5px}
.br.tr{right:0;top:0;border-top-width:1.5px;border-right-width:1.5px}
.br.bl{left:0;bottom:0;border-bottom-width:1.5px;border-left-width:1.5px}
.br.brr{right:0;bottom:0;border-bottom-width:1.5px;border-right-width:1.5px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:99px;padding:6px 14px;background:rgba(30,12,48,.5)}
.status i{width:7px;height:7px;border-radius:50%;background:#7dffb0;box-shadow:0 0 8px #7dffb0;animation:blink 2s ease-in-out infinite}
h1.title{font-family:var(--f-logo);font-weight:400;font-size:clamp(38px,9.2vw,104px);letter-spacing:.16em;margin:22px 0 0;line-height:1;text-shadow:0 0 30px rgba(200,140,255,.45);padding-left:.16em}
h1.title span{display:inline-block}
.sub{font-family:var(--f-logo);font-size:clamp(10px,1.4vw,14px);letter-spacing:.5em;color:var(--ink2);margin-top:14px;padding-left:.5em}
.side{position:absolute;top:170px;font-family:var(--f-logo);font-size:11px;line-height:1.9;letter-spacing:.14em;color:var(--ink2);text-align:left}
.side.l{left:12px}.side.r{right:12px;text-align:right}
.side span{display:block}
.figure{position:relative;margin:-10px auto 0;max-width:680px;aspect-ratio:480/228;
  -webkit-mask:linear-gradient(to bottom,transparent 0,#000 22%,#000 70%,transparent 100%);mask:linear-gradient(to bottom,transparent 0,#000 22%,#000 70%,transparent 100%)}
.figure .img{position:absolute;inset:-4%;background:url(assets/hero.jpg) center/cover;will-change:transform}
.figure .orb{position:absolute;left:49.6%;top:57%;width:36%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;
  background:radial-gradient(circle,rgba(230,170,255,.55) 0,rgba(180,77,255,.25) 40%,transparent 68%);mix-blend-mode:screen;pointer-events:none}
.scroll{display:inline-flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;letter-spacing:.2em;color:var(--muted);margin:4px 0 18px}
.scroll i{width:1px;height:26px;background:linear-gradient(var(--vio2),transparent);animation:drip 1.8s ease-in-out infinite}

.ticker{overflow:hidden;border-block:1px solid rgba(180,77,255,.25);background:rgba(25,10,40,.5);margin:26px 0 0;-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.ticker div{display:flex;width:max-content;animation:marquee 28s linear infinite}
.ticker span{font-family:var(--f-logo);font-size:12px;letter-spacing:.3em;color:var(--ink2);padding:12px 0;white-space:nowrap}
.ticker b{color:var(--vio2);font-weight:400;padding:0 18px}

.about{display:grid;grid-template-columns:1fr auto 1fr;gap:34px;align-items:center;margin-top:56px}
.about h2{font-family:var(--f-head);font-weight:700;font-size:clamp(30px,4.6vw,52px);line-height:1.02;margin:0;text-align:right;letter-spacing:-.01em}
.about h2 em{font-style:normal;background:linear-gradient(90deg,#c46bff,#e7b3ff,#a43cf0,#c46bff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 6s linear infinite}
.vline{width:1px;height:120px;background:linear-gradient(transparent,rgba(255,255,255,.5),transparent)}
.about .txt{display:grid;gap:14px;max-width:40ch;min-width:0}
.about .kick{font-size:12px;letter-spacing:.18em;color:var(--vio2);text-transform:uppercase;margin:0}
.about h3{margin:0 0 3px;font-family:var(--f-head);font-weight:500;font-size:14px;letter-spacing:.04em}
.about p{margin:0;color:var(--ink2);font-size:14px}
.stats{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:40px auto 0;max-width:860px;padding:14px 26px}
.stats .br{border-color:var(--vio)}
.stat{display:flex;gap:12px;align-items:center;justify-content:center;padding:6px 10px;border-right:1px solid rgba(255,255,255,.12)}
.stat:last-of-type{border-right:0}
.stat svg{width:28px;height:28px;stroke:var(--ink2);fill:none;stroke-width:1.4;flex:none}
.stat b{display:block;font-family:var(--f-head);font-size:clamp(20px,2.6vw,28px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}

.shead{display:flex;align-items:center;gap:30px;margin:64px 0 22px}
.shead h2{font-family:var(--f-head);font-weight:700;font-size:clamp(26px,4vw,42px);margin:0;letter-spacing:.02em}
.shead p{margin:0;font-size:13px;color:var(--ink2);max-width:40ch;border-left:1px solid rgba(255,255,255,.3);padding-left:30px}

.apps{display:grid;grid-template-columns:1fr 1fr;gap:22px;perspective:1000px}
.app{position:relative;border-radius:18px;overflow:hidden;min-height:230px;padding:24px 30px;border:1px solid var(--line);background:var(--card);transform-style:preserve-3d;transition:transform .5s var(--ease),box-shadow .5s;--mx:50%;--my:50%}
.app .pic{position:absolute;right:0;top:0;bottom:0;width:48%;background-size:cover;background-position:center;transition:transform .8s var(--ease);-webkit-mask:linear-gradient(90deg,transparent,#000 35%);mask:linear-gradient(90deg,transparent,#000 35%)}
.app .glare{position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx) var(--my),rgba(210,140,255,.22),transparent 45%);opacity:0;transition:opacity .4s;pointer-events:none}
.app:hover{box-shadow:0 20px 50px -20px rgba(180,77,255,.7),0 0 0 1px rgba(200,130,255,.6)}
.app:hover .glare{opacity:1}
.app:hover .pic{transform:scale(1.08)}
.app .in{position:relative;max-width:58%}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.12em;border-radius:99px;padding:4px 10px;border:1px solid rgba(214,150,255,.6);color:var(--vio2);background:rgba(120,40,190,.18)}
.chip svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
.app h3{font-family:var(--f-head);font-style:italic;font-weight:800;font-size:clamp(22px,2.6vw,28px);line-height:.98;margin:12px 0 10px}
.app p{font-size:13px;color:var(--ink2);margin:0 0 12px}
.app .num{font-size:12px;color:var(--muted);margin-bottom:16px}
.app .num b{color:var(--ink);font-family:var(--f-head);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.dl{display:inline-flex;align-items:center;gap:10px;height:34px;padding:0 16px;border:1px solid rgba(255,255,255,.55);border-radius:99px;font-size:13px;transition:background .4s,gap .4s var(--ease),border-color .4s}
.dl svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .4s var(--ease)}
.dl:hover{background:rgba(180,77,255,.35);border-color:var(--vio2);gap:14px}
.dl:hover svg{transform:translateY(2px)}

.media{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.shot{position:relative;aspect-ratio:400/190;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px;isolation:isolate}
.shot .bg{position:absolute;inset:0;z-index:-2;background-size:cover;background-position:center;transition:transform 1.4s var(--ease)}
.shot::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 25%,rgba(10,4,18,.88))}
.shot::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,220,255,.28) 48%,transparent 62%);transform:translateX(-120%);pointer-events:none}
.shot.lit::after{animation:sweep 1.4s .2s var(--ease) both}
.shot:hover .bg{transform:scale(1.07)}
.shot h3{margin:0;font-family:var(--f-head);font-weight:700;font-size:20px}
.shot p{margin:4px 0 12px;font-size:13px;color:var(--ink2);max-width:40ch}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:7px 13px;border-radius:99px;border:1px solid rgba(255,255,255,.4);background:rgba(10,4,18,.5);backdrop-filter:blur(6px);transition:border-color .3s,box-shadow .3s}
.links a:hover{border-color:var(--vio2);box-shadow:0 0 14px rgba(180,77,255,.6)}
.links svg{width:14px;height:14px;fill:currentColor}

.hist{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.circ{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(20,10,32,.7);display:grid;place-items:center;transition:box-shadow .3s,border-color .3s}
.circ:hover{border-color:var(--vio2);box-shadow:0 0 16px rgba(180,77,255,.6)}
.circ svg{width:16px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 36px)/3);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:12px 2px 14px}
.track::-webkit-scrollbar{display:none}
.ph{scroll-snap-align:start;position:relative;aspect-ratio:4/3;border-radius:14px;border:1px solid var(--line);overflow:hidden;cursor:zoom-in;transition:transform .5s var(--ease),border-color .4s,box-shadow .5s;
  background:radial-gradient(ellipse at 50% 120%,rgba(200,110,255,.55),transparent 60%),linear-gradient(180deg,#24103a,#100818)}
.ph .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1s var(--ease)}
.ph::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(10,4,18,.85))}
.ph span{position:absolute;left:14px;bottom:10px;z-index:1;font-family:var(--f-head);font-size:12px;color:var(--vio2);letter-spacing:.08em}
.ph.on,.ph:hover{transform:translateY(-8px);border-color:rgba(214,150,255,.9);box-shadow:0 18px 40px -18px rgba(180,77,255,.9)}
.ph:hover .bg{transform:scale(1.06)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:6px}
.dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.25);transition:width .4s var(--ease),background .4s}
.dots i.on{width:22px;background:var(--vio2)}

.join{text-align:center;margin-top:70px}
.join h2{font-family:var(--f-head);font-weight:700;font-size:clamp(26px,4vw,42px);margin:0}
.join > p{color:var(--ink2);margin:10px auto 0;max-width:46ch}
.req{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.req span{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(40,16,62,.5)}
.req svg{width:14px;height:14px;stroke:var(--vio2);fill:none;stroke-width:2.2}
.cta{display:flex;justify-content:center;align-items:center;gap:26px;flex-wrap:wrap;margin:34px 0 30px}
.big{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:18px;padding:18px 46px;border-radius:99px;font-family:var(--f-head);font-weight:500;font-size:clamp(16px,2.4vw,26px);letter-spacing:.04em;border:1.5px solid #d08cff;background:linear-gradient(180deg,rgba(150,60,230,.55),rgba(70,20,120,.6));animation:breathe 3.2s ease-in-out infinite}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-130%);animation:shine 4s 1.5s ease-in-out infinite}
.big svg{width:28px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .4s var(--ease)}
.big:hover svg{transform:translateX(8px)}

footer{position:relative;text-align:center}
.foot-t{font-family:var(--f-logo);font-size:11px;letter-spacing:.6em;color:var(--ink2);padding-left:.6em}
.foot-l{display:flex;justify-content:center;gap:22px;margin:16px 0 8px;font-size:13px}
.foot-l a{color:var(--ink2);transition:color .3s}.foot-l a:hover{color:var(--vio2)}
.copy{font-size:12px;color:var(--muted);padding-bottom:18px}
.ground{position:relative;height:clamp(110px,18vw,230px);background:url(assets/ground.jpg) center bottom/cover;overflow:hidden}
.fog{position:absolute;inset:-20% -50%;background:radial-gradient(40% 50% at 30% 70%,rgba(160,70,230,.35),transparent 70%),radial-gradient(35% 45% at 75% 60%,rgba(120,40,200,.3),transparent 70%);animation:drift 18s linear infinite alternate;mix-blend-mode:screen}
.fog.b{animation-duration:26s;animation-direction:alternate-reverse;opacity:.7}

.lb{position:fixed;inset:0;z-index:50;background:rgba(5,2,10,.9);backdrop-filter:blur(8px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .35s}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:min(1100px,100%);max-height:84vh;border-radius:12px;border:1px solid var(--line);box-shadow:0 0 60px rgba(180,77,255,.35);transform:scale(.94);transition:transform .45s var(--ease)}
.lb.open img{transform:none}
.lb .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,calc(env(safe-area-inset-right,0px) + 16px))}
.lb .p{position:absolute;left:max(16px,calc(env(safe-area-inset-left,0px) + 16px));top:50%;translate:0 -50%}
.lb .n{position:absolute;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));top:50%;translate:0 -50%}
.lb .cnt{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;text-align:center;font-family:var(--f-head);font-size:12px;color:var(--ink2)}

.intro .nav{animation:dropIn .9s var(--ease) both}
.intro h1.title span{animation:letter 1.1s var(--ease) both;animation-delay:calc(.25s + var(--i)*.08s)}
.intro .sub{animation:track 1.6s .7s var(--ease) both}
.intro .frame>.br{animation:corner .9s .5s var(--ease) both}
.intro .side span{animation:fadeL .8s var(--ease) both;animation-delay:calc(1s + var(--i)*.12s)}
.intro .side.r span{animation-name:fadeR}
.intro .figure{animation:rise 1.6s .3s var(--ease) both}
.intro .status{animation:fadeL .8s .2s var(--ease) both}
.figure .img{animation:float 7s ease-in-out infinite}
.figure .orb{animation:pulse 3.4s ease-in-out infinite}
.rv{transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.pre{opacity:.25;transform:translateY(36px) scale(.98)}

@keyframes dropIn{from{transform:translateY(-100%);opacity:0}}
@keyframes letter{from{transform:translateY(60%) scale(.9);opacity:0;filter:blur(12px)}}
@keyframes track{from{letter-spacing:1.4em;opacity:0}}
@keyframes corner{from{opacity:0;transform:scale(2.4)}}
@keyframes fadeL{from{opacity:0;transform:translateX(-14px)}}
@keyframes fadeR{from{opacity:0;transform:translateX(14px)}}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.95)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
@keyframes hue{to{background-position:300% 0}}
@keyframes sweep{to{transform:translateX(120%)}}
@keyframes breathe{0%,100%{box-shadow:0 0 18px rgba(180,77,255,.45),inset 0 0 14px rgba(220,160,255,.25)}50%{box-shadow:0 0 42px rgba(180,77,255,.85),inset 0 0 22px rgba(220,160,255,.45)}}
@keyframes shine{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes drift{to{transform:translateX(18%)}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes blink{50%{opacity:.35}}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

@media (max-width:860px){
  .nav nav,.nav .btns .pill:not(.solid){display:none}
  .burger{display:grid}
  .mnav{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
  .mnav>div{overflow:hidden}
  .mnav.open{grid-template-rows:1fr}
  .mnav a{display:block;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);font-size:15px}
  .side{display:none}
  .about{grid-template-columns:1fr;text-align:center;gap:18px}.about h2{text-align:center}.about .txt{margin:0 auto}.vline{display:none}
  .stats{grid-template-columns:1fr 1fr;row-gap:12px}.stat{border-right:0;justify-content:flex-start}
  .apps,.media{grid-template-columns:1fr}
  .app .in{max-width:65%}
  .shot{aspect-ratio:auto;min-height:230px}
  .track{grid-auto-columns:78%}
  .hist{grid-template-columns:minmax(0,1fr)}.hist .circ{display:none}
  .shead{flex-direction:column;align-items:flex-start;gap:10px}.shead p{border-left:0;padding-left:0}
  .stats{padding:14px 18px}
}
@media (max-width:420px){.logo{font-size:14px}.pill.solid{padding:7px 12px;font-size:12px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv.pre{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<canvas id="stars" aria-hidden="true"></canvas>
